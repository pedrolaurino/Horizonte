<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte</title>
    
    <!-- Carrega o motor do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style type="text/tailwindcss">
        /* AQUI ENTRA O CÓDIGO QUE VOCÊ GEROU NO LOVABLE */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        @layer base {
          :root {
            --background: 232 35% 9%;
            --foreground: 0 0% 98%;
            --card: 232 35% 12%;
            --card-foreground: 0 0% 98%;
            --popover: 232 35% 12%;
            --popover-foreground: 0 0% 98%;
            --primary: 38 92% 55%;
            --primary-foreground: 232 35% 9%;
            --secondary: 263 50% 52%;
            --secondary-foreground: 0 0% 98%;
            --muted: 232 20% 18%;
            --muted-foreground: 0 0% 60%;
            --accent: 263 50% 52%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 232 20% 18%;
            --input: 232 20% 18%;
            --ring: 38 92% 55%;
            --radius: 0.75rem;
          }
        }

        @layer base {
          body {
            @apply bg-[#0d1117] text-white; /* Corrigido para o padrão Tailwind */
            font-family: 'Inter', sans-serif;
          }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Exemplo de como o conteúdo deve ser escrito usando Tailwind -->
    <div class="max-w-md w-full bg-[#161b22] p-8 rounded-xl border border-[#30363d] shadow-2xl animate-in">
        <h1 class="text-4xl font-bold text-center mb-2 text-[#f0b03e]">Horizonte</h1>
        <p class="text-gray-400 text-center mb-8">Entre para acompanhar o tempo de liberdade da família.</p>
        
        <form class="space-y-4">
            <input type="email" placeholder="E-mail" class="w-full p-3 rounded-lg bg-[#0d1117] border border-[#30363d] focus:border-[#f0b03e] outline-none">
            <input type="password" placeholder="Senha" class="w-full p-3 rounded-lg bg-[#0d1117] border border-[#30363d] focus:border-[#f0b03e] outline-none">
            
            <button class="w-full py-3 px-4 bg-[#6366f1] hover:bg-[#5254e5] text-white font-semibold rounded-lg transition-colors">
                Entrar / Cadastrar
            </button>
        </form>
    </div>

</body>
</html>
